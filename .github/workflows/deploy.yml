# Builds the game and publishes it to GitHub Pages on every push to main.
# The unit tests (including the checks on all 990 levels) must pass first.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GameHub's shared toolbox is bundled into the game (see vite.config.ts).
      - uses: actions/checkout@v4
        with:
          repository: standan3126/standan3126.github.io
          path: .hub
          sparse-checkout: shared
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
        env:
          SHARED_DIR: .hub/shared/v1
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SHARED_DIR: .hub/shared/v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
